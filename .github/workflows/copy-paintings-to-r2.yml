# Copies the paintings that were in git into R2 (Cloudflare's file storage), on GitHub's machines.
# Started by hand only: on GitHub, Actions, "Copy paintings to R2", "Run workflow".
#
# It only adds files to the chosen bucket: nothing in git or on the site changes. Running it again copies the
# same files again. Unticked, "Copy" just lists what would be copied.
#
# The list comes from tools/copy_paintings_to_r2.py (it only reads files). The copying uses an R2 key limited to
# reading and writing objects in the two buckets, stored as the repository secrets R2_ACCESS_KEY_ID and
# R2_SECRET_ACCESS_KEY. GitHub never shows a secret's value, even in the run's log.

name: Copy paintings to R2

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: Which bucket
        type: choice
        options: [site-media-dev, site-media]
        required: true
      copy:
        description: Copy (unticked, it only lists what would be copied)
        type: boolean
        default: false

permissions:
  contents: read          # it can read the repository and nothing else on GitHub

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: List the files
        run: |
          python3 tools/copy_paintings_to_r2.py > plan.tsv
          echo "$(wc -l < plan.tsv) files:"
          cat plan.tsv

      - name: Copy them to ${{ inputs.bucket }}
        if: ${{ inputs.copy }}
        env:
          BUCKET: ${{ inputs.bucket }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required     # what R2 expects from this tool
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2: https://25c3889713f570f320faf5397c0e5f81.r2.cloudflarestorage.com   # the account's R2 address
        run: |
          set -e
          while IFS=$'\t' read -r path key type; do
            aws s3 cp "$path" "s3://$BUCKET/$key" --content-type "$type" --endpoint-url "$R2" --only-show-errors
            echo "copied $key"
          done < plan.tsv
          echo "Done: $(wc -l < plan.tsv) files in $BUCKET"
