# The gallery: every painting on the site, in the order shown.
#
# After any change here, or to a master image, run from the site folder:
#     python3 tools/build_site.py
# It makes the image sizes, the gallery on the home page and each painting's own page.
#
# Each painting needs:
#   title:    the caption. Its master image and page address come from it, by a fixed rule:
#             "Collaboration with Teo #1" -> masters/collaboration-with-teo-1.png
#                                           and the page paintings/collaboration-with-teo-1/
#             (python3 tools/build_site.py --name "A Title" prints the name for a title)
#             Put a title containing # in quotes: in YAML, " #" otherwise starts a comment.
# and can have:
#   details:  a second line under the caption: medium, size (height x width), year,
#             e.g. Oil on canvas, 60 x 90 cm, 2020
#   wide:     true to span the full width of the gallery
#
# Masters can be PNG, WebP, JPEG or TIFF, ideally at least 2560 pixels wide.
# Portrait or landscape is worked out from the master.
# The home page's contact section uses masters/contact-background (PNG, JPEG or WebP; ideally 3840 wide).

# How the floating gallery feels. The paintings' places are worked out from these, so adding a painting
# never means placing it by hand. Leave a line out to use its default.
gallery:
  spacing: 4       # distance in depth from one painting to the next (default 6)
  spread: 0.75     # how widely they're scattered side to side and up and down (default 1)
  glide: 0.075     # how quickly movement settles: lower glides for longer (default 0.075)

sections:
  - title: Featured
    paintings:
      - title: Green Background with Seven Figures
        details: Oil on canvas, 60 x 90 cm, 2023
        wide: true

  - title: Abstracts
    paintings:
      - title: Composition in Blue with Border
        details: Oil on canvas, 60 x 90 cm, 2020
      - title: Composition in Red with Border
        details: Oil on canvas, 60 x 90 cm, 2020
      - title: Composition in Green with Border
        details: Oil on canvas, 60 x 90 cm, 2020
      - title: Composition in Yellow with Border
        details: Oil on canvas, 60 x 90 cm, 2020
      - title: "Collaboration with Teo #1"
        details: Soft pastel on paper, 30 x 42 cm, 2025
      - title: "Collaboration with Teo #2"
        details: Soft pastel on paper, 30 x 42 cm, 2025
      - title: "Collaboration with Teo #3"
        details: Watercolour on cotton paper, 30 x 42 cm, 2026

  - title: Plein Air
    paintings:
      - title: "Seascape #1"
        details: Oil on board, 15 x 21 cm, 2024
      - title: "Mont Sainte-Victoire, after Cézanne"
        details: Oil on canvas, 60 x 90 cm, 2020
      - title: "Cjón. de las Tomasas, Albaicín, Granada"
        details: Oil on canvas, 21 x 15 cm, 2002
      - title: "Ponte Alda Merini, Milan"
        details: Oil on canvas, 21 x 15 cm, 2004
      - title: "Nighttime, Brussels"
        details: Oil on canvas, 21 x 15 cm, 2013

  - title: Still Life
    paintings:
      - title: "Apple #1"
        details: Oil on canvas paper, 15 x 21 cm, 2023
      - title: "Apple #2"
        details: Oil on canvas paper, 15 x 21 cm, 2023
