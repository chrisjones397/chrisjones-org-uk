        details: Charcoal and chalk on paper, 2026
        white_paper: true
      - title: "Life Drawing #2"
        details: Charcoal and chalk on paper, 2026
        white_paper: true
      - title: "Life Drawing #3"
        details: Charcoal and chalk on paper, 2026
        white_paper: true
