<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Editor - Christopher Jones - Fine Art</title>
<!-- The site's editor, at admin.chrisjones.org.uk/admin/ (admin-dev... for dev). worker.js serves it only to someone
     signed in through Cloudflare Access; editor.js (server) holds the content API; admin/editor.js runs this page.
     Changes are saved as drafts straight away; nothing reaches visitors until it's published under "Review". -->
<style>
  :root { color-scheme: dark; --ink: #eee; --dim: #9a9a9a; --line: #3a3a3a; --card: #232323; --glow: #fff8e0;
          --new: #8fd18f; --changed: #f5c66b; --gone: #f08c8c; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: #1a1a1a; color: var(--ink);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  a { color: var(--ink); text-decoration: none; }
  a:hover { text-shadow: 0 0 8px var(--glow); }
  header { position: sticky; top: 0; z-index: 5; background: rgba(26,26,26,0.94); backdrop-filter: blur(8px);
           border-bottom: 1px solid var(--line); }
  .bar { max-width: 46rem; margin: 0 auto; padding: 0.7rem 1rem; display: flex; gap: 0.9rem; align-items: center; flex-wrap: wrap; }
  .bar .site { font-weight: 300; font-size: 1.2rem; margin-right: auto; }
  @media (max-width: 440px) { .bar .site { display: none; } .bar a[data-view="content"] { margin-left: 0; } }
  .bar a:last-child { margin-left: auto; }
  .bar a.on { color: #fff; border-bottom: 2px solid #ddd; }
  .count { display: inline-block; min-width: 1.4em; padding: 0 0.35em; margin-left: 0.25em; border-radius: 999px;
           background: var(--changed); color: #111; font-size: 0.8rem; text-align: center; }
  main { max-width: 46rem; margin: 0 auto; padding: 1rem 1rem 6rem; }
  h1 { font-weight: 300; font-size: 1.6rem; margin: 0.6rem 0 0.4rem; }
  h2 { font-weight: 400; font-size: 1.15rem; margin: 1.8rem 0 0.6rem; }
  p.hint { color: var(--dim); font-size: 0.9rem; margin: 0.2rem 0 1rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 0.8rem; margin: 0.6rem 0; }
  label { display: block; margin: 0.8rem 0 0.25rem; color: var(--dim); font-size: 0.85rem; }
  input[type=text], select, textarea { width: 100%; padding: 0.55rem 0.65rem; font: inherit; color: var(--ink);
    background: #1c1c1c; border: 1px solid var(--line); border-radius: 6px; }
  textarea { min-height: 9rem; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #888; }
  .tick { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.7rem; }
  .tick input { width: 1.2rem; height: 1.2rem; }
  button { font: inherit; font-size: 0.9rem; padding: 0.45rem 0.8rem; color: var(--ink); background: #333;
           border: 1px solid #4a4a4a; border-radius: 6px; cursor: pointer; }
  button:hover { background: #3c3c3c; }
  button.main { background: #ddd; color: #111; border-color: #ddd; }
  button.main:hover { background: #fff; }
  button.danger { color: var(--gone); }
  button:disabled { opacity: 0.45; cursor: default; }
  .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .row .grow { flex: 1; min-width: 8rem; }
  .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.8rem; }
  .badge { font-size: 0.75rem; padding: 0.05rem 0.45rem; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .badge.new { color: var(--new); } .badge.changed { color: var(--changed); } .badge.gone { color: var(--gone); }
  .painting { display: flex; gap: 0.7rem; align-items: center; padding: 0.5rem 0; border-top: 1px solid var(--line); }
  .painting:first-of-type { border-top: 0; }
  .painting img { width: 64px; height: 64px; object-fit: cover; border-radius: 4px; background: #111; flex: none; }
  .painting .what { flex: 1; min-width: 0; }
  .painting .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .painting .d { color: var(--dim); font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .painting.deleted .what { opacity: 0.5; text-decoration: line-through; }
  .move button { padding: 0.3rem 0.55rem; }
  .edit { margin: 0.2rem 0 0.8rem; }
  .diff { font-size: 0.88rem; margin: 0.3rem 0 0 1.9rem; color: var(--dim); }
  .diff b { color: var(--ink); font-weight: 400; }
  .diff del { color: var(--gone); } .diff ins { color: var(--new); text-decoration: none; }
  .change { display: flex; gap: 0.6rem; align-items: flex-start; }
  .change input { width: 1.2rem; height: 1.2rem; margin-top: 0.2rem; flex: none; }
  #toast { position: fixed; left: 50%; bottom: 1.2rem; transform: translateX(-50%); padding: 0.6rem 1rem; border-radius: 8px;
           background: #333; box-shadow: 0 2px 12px rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.2s; pointer-events: none;
           max-width: 90vw; z-index: 10; }
  #toast.show { opacity: 1; } #toast.error { background: #5a2626; }
  .muted { color: var(--dim); }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin: 0.6rem 0; cursor: zoom-in; }
  .compare.big { grid-template-columns: 1fr; cursor: zoom-out; }
  .compare.one { grid-template-columns: minmax(0, 24rem); }
  .compare.one.big { grid-template-columns: 1fr; }
  .compare[hidden] { display: none; }
  .compare figure { margin: 0; min-width: 0; }
  .compare .shot { display: block; width: 100%; height: auto; border-radius: 4px; background: #111; }
  .compare figcaption { color: var(--dim); font-size: 0.85rem; margin-top: 0.25rem; }
  .steps { margin-top: 0.4rem; }
  .sliders input[type=range] { width: 100%; }
  .sliders label { margin-top: 0.6rem; }
  .darkroom { position: fixed; inset: 0; z-index: 20; background: #000; display: flex; flex-direction: column; }
  .dr-bar { padding: 0.5rem 0.7rem; padding-top: max(0.5rem, env(safe-area-inset-top)); background: #1a1a1a;
            border-bottom: 1px solid var(--line); }
  .dr-hint { margin: 0 0 0.45rem; font-size: 0.88rem; color: var(--dim); }
  .dr-buttons { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
  .dr-buttons button { min-width: 2.4rem; }
  .dr-count { margin-left: auto; color: var(--dim); font-size: 0.85rem; }
  .dr-canvas { flex: 1; width: 100%; min-height: 0; touch-action: none; display: block; cursor: crosshair; }
  .dr-loupe { position: absolute; width: 150px; height: 150px; border-radius: 50%; border: 2px solid #fff;
              box-shadow: 0 2px 14px rgba(0,0,0,0.7); pointer-events: none; display: none; margin-top: 0; }
  #upload-progress { color: var(--dim); font-size: 0.9rem; margin-top: 0.6rem; min-height: 1.4em; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="site">Editor</span>
    <a href="#content" data-view="content">Content</a>
    <a href="#review" data-view="review">Review<span class="count" id="count" hidden></span></a>
    <a href="#history" data-view="history">History</a>
    <a href="/" target="_blank" rel="noopener">Preview ↗</a>
  </div>
</header>
<main id="main"><p class="muted">Loading…</p></main>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="editor.js"></script>
</body>
</html>
