<title>Editor - Christopher Jones - Fine Art</title>
<!-- The site's editor, at admin.chrisjones.org.uk/admin/ (admin-dev... for dev). worker.js serves it only to someone

<style>

    animation: saved-field 3.5s linear forwards; }
  textarea.saved { background-position: right 0.5rem top 0.5rem; }
  .move button { padding: 0.3rem 0.55rem; }
  .edit { margin: 0.2rem 0 0.8rem; }

  .compare.big .shot { max-height: 80vh; }
  .compare figcaption { color: var(--dim); font-size: 0.85rem; margin-top: 0.25rem; }
  .compare.reopen figure.photo { grid-column: 1 / -1; }

  .compare.reopen .photo .shot { max-height: 16vh; }
  .compare.reopen.big .shot { max-height: 80vh; }
  .compare .hold { position: relative; width: fit-content; max-width: 100%; margin: 0 auto;
                   -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .compare .hold .over { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
                         background: #111; border-radius: 4px; }
  .steps { margin-top: 0.4rem; }

  details.step:last-child { border-bottom: 1px solid var(--line); }

  details.step > summary::-webkit-details-marker { display: none; }

  .dr-foot { align-items: flex-start; }

  .box { margin-top: 0.7rem; }

  .sliders input[type=range] { width: 100%; }

  .dr-bar { padding: 0.5rem 0.7rem; padding-top: max(0.5rem, env(safe-area-inset-top)); background: #1a1a1a;

  .dr-buttons .dr-cancel { margin-left: auto; }

  .lib-item { border-top: 1px solid var(--line); padding: 0.3rem 0 0.5rem; }

<body>
<header>
  <div class="bar">
    <span class="site">Editor</span>
    <a href="#gallery" data-view="gallery">Gallery</a>
    <a href="#content" data-view="content">Content</a>
    <a href="#library" data-view="library">Library</a>
