<!-- The site's header, one copy for every page: worker.js puts it in place of <header data-partial="header"> as
     each page is served. Its links start from the top of the site (/#contact), so they work from any address;
     on the home page they just scroll to the place. -->
<header id="header" class="header">
  <div class="header-block">
    <a href="/#" class="site-title"><span class="site-name">Christopher Jones</span> <span class="site-tag">Fine Art</span></a>
    <nav class="nav">
      <ul class="nav-list">
        <li><a href="/#gallery" class="nav-link">Gallery</a></li>
        <li><a href="/#contact" class="nav-link">Contact</a></li>
        <li><a href="/#profile" class="nav-link">Profile</a></li>
        <li class="nav-icons">
          <!-- an icon for each ticked contact link (entry links, put in by site.js) -->
        </li>
        <li class="nav-pause">
          <!-- pauses everything that moves (pause.js); hidden until something on the page moves by itself -->
          <button type="button" class="nav-link nav-icon pause-button" id="pause-motion" hidden aria-pressed="false" aria-label="Pause moving pictures" title="Pause moving pictures">
            <svg class="when-playing" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><circle cx="12" cy="12" r="9.5"/><path d="M9.6 8.4v7.2M14.4 8.4v7.2"/></svg>
            <svg class="when-paused" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><circle cx="12" cy="12" r="9.5"/><path d="M10 8.3l5.6 3.7-5.6 3.7z"/></svg>
          </button>
        </li>
      </ul>
    </nav>
  </div>
  <!-- The gallery's two views, floating and grid: just under the header, their right edge under the menu's
       (header.js measures it). Shown on the gallery page, the current view lit, and on the home page while its
       gallery is in view (leading to the whole gallery in either view). header.js shows them and switches views. -->
  <nav class="view-switch" aria-label="Views of the gallery" hidden>
    <a href="/gallery/?view=floating" class="nav-link nav-icon" data-view="floating" title="The gallery, floating" aria-label="The gallery, floating">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.8"><path d="M2.5 7.5h8.5v6.5H2.5zM14 3.5h7.5v5.5H14zM11 15.5h7v5H11z"/></svg>
    </a>
    <a href="/gallery/?view=grid" class="nav-link nav-icon" data-view="grid" title="The gallery as a grid" aria-label="The gallery as a grid">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.8"><path d="M4 4h6.5v6.5H4zM13.5 4H20v6.5h-6.5zM4 13.5h6.5V20H4zM13.5 13.5H20V20h-6.5z"/></svg>
    </a>
  </nav>
  <p class="copied-tip" id="copied-tip" role="status" aria-live="polite">Email address copied</p>
</header>
